name: Tests

# Suite de bout en bout (Playwright, réseau simulé) : à chaque pull request, à chaque push sur main
# (un push sur une autre branche est testé par sa pull request : pas de double exécution).
# Puis publication sur la branche gh-pages (#97, #117), seulement si les tests passent :
# racine = main, /classique/ = version classique figée, /pr-N/ = préversion de chaque pull request (retirée à sa fermeture).
# À la publication de main, l'étiquette vX.Y.Z (version de package.json) est posée si elle n'existe pas.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read

# Un nouveau push annule l'exécution encore en cours sur la même branche ou pull request
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # Pull request fermée : rien à tester, seule sa préversion est retirée (job publish)
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Références d'image (tests/references.py) : le site est comparé à celui de la branche de base, construit à part
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Site publié : dist/ (scripts réunis et minifiés, VERSION et liste APP de sw.js générées ; #102)
      - name: Construction
        run: npm ci --no-audit --no-fund && npm run build
      # Pas de « playwright install --with-deps » (plusieurs minutes d'apt-get) : on pilote le Google Chrome
      # déjà présent sur l'image ubuntu-latest, via la variable CHROME lue par chaque test.
      - name: Dépendances
        run: |
          pip install playwright mapbox-vector-tile
          echo "CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
          google-chrome --version
      # Sur dist/, c'est-à-dire ce qui sera publié (tests unit et globals : sur les sources)
      - name: Tests de bout en bout
        env:
          CMS_ROOT: dist
        run: python tests/run_all.py
      - name: Captures d'écran (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: captures
          path: tests/*.png
          if-no-files-found: ignore

  publish:
    needs: e2e
    # Tests réussis, ou pull request fermée ; jamais pour une pull request venue d'un fork (pas de droit d'écriture)
    if: >-
      always() &&
      (needs.e2e.result == 'success' || (github.event.action == 'closed' && needs.e2e.result == 'skipped')) &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # écrire la branche gh-pages
      pull-requests: write   # lien de la préversion dans la pull request
    # Une seule écriture de gh-pages à la fois, sans en annuler aucune
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Publication sur gh-pages
        env:
          REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          PR: ${{ github.event.pull_request.number }}
          PR_DIR: ${{ github.workspace }}
          PR_CLOSE: ${{ github.event.action == 'closed' && '1' || '0' }}
        run: bash .github/scripts/pages.sh
      # Étiquette SemVer de la version publiée (package.json), posée une seule fois
      - name: Étiquette de version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags "$REMOTE" "refs/tags/$tag" >/dev/null 2>&1; then
            echo "✓ $tag existe déjà"
          else
            git tag "$tag" "$GITHUB_SHA" && git push --quiet "$REMOTE" "refs/tags/$tag" && echo "✓ étiquette $tag posée"
          fi
      - name: Lien de la préversion
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo, n = context.issue.number;
            const base = `https://${owner}.github.io/${repo}/`;
            const marker = '<!-- preversion-pages -->';
            const body = [marker,
              `**Préversion** de cette pull request : ${base}pr-${n}/`,
              '',
              `Version publiée : ${base} · version classique (figée) : ${base}classique/`,
              '',
              '_Disponible une à deux minutes après la publication ; retirée à la fermeture de la pull request._'].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number: n});
            const mine = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (mine) await github.rest.issues.updateComment({owner, repo, comment_id: mine.id, body});
            else await github.rest.issues.createComment({owner, repo, issue_number: n, body});
