name: Tests

# Suite de bout en bout (Playwright, réseau simulé) : à chaque push et à chaque pull request.
# Le site lui-même reste publié tel quel par GitHub Pages (aucune étape de build).
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dépendances
        run: |
          pip install playwright mapbox-vector-tile
          python -m playwright install --with-deps chromium
      - name: Tests de bout en bout
        run: python tests/run_all.py
      - name: Captures d'écran (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: captures
          path: tests/*.png
          if-no-files-found: ignore
